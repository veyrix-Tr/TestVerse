<style>
:root {
  color-scheme: light;
  --bg: #F5F6FB; --card: #FFFFFF; --soft: #F1F3F9; --ink: #1B1F3B; --muted: #565B7A; --line: #DEE1EE; --field: #C7CBE3;
  --navy: #16294A; --navy-2: #1F3961; --navy-line: #3A557F;
  --gold: #F2C14E; --gold-soft: #FFF6E0; --gold-line: #EED9A4; --gold-ink: #6B4A00;
  --blue: #3D4FD9; --blue-ink: #2E3EB8; --blue-soft: #E4E7FB;
  --green: #1E7A46; --green-soft: #DDF1E4; --green-ink: #155C34;
  --orange: #B45309; --orange-soft: #FDEBD3; --orange-ink: #8A3C00;
  --purple: #5B2D91; --purple-soft: #EFE7F8;
  --red: #B42318; --red-soft: #FDECEA;
  --grey-soft: #ECEEF7;
  --display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Noto Sans Devanagari", "Segoe UI", system-ui, sans-serif;
  --qsize: 17px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0F1426; --card: #141B33; --soft: #1A2240; --ink: #E8EBF7; --muted: #A9B0CF; --line: #2A3355; --field: #3A4470;
    --navy: #0F1E36; --navy-2: #1A3156;
    --gold-soft: #241F12; --gold-line: #4A3F1E; --gold-ink: #EBD9A8;
    --blue: #8F9CFF; --blue-ink: #B3BCFF; --blue-soft: #222C5A;
    --green: #4CC07F; --green-soft: #14321F; --green-ink: #8FE0B0;
    --orange: #F0A060; --orange-soft: #3A2414; --orange-ink: #F6B98A;
    --purple: #B794E8; --purple-soft: #2A1E40;
    --red: #FF8A80; --red-soft: #3A1714;
    --grey-soft: #222A48;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.2; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 10px; font: 600 14px/1 var(--body); cursor: pointer; border: 1px solid transparent; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--blue); color: #FFFFFF; }
.btn-green { background: #1E7A46; color: #FFFFFF; }
.btn-purple { background: #5B2D91; color: #FFFFFF; }
.btn-dark { background: var(--navy); color: #FFFFFF; }
.btn-gold { background: var(--gold); color: #1B1F3B; }
.btn-outline { background: var(--card); color: var(--ink); border-color: var(--field); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

.bar { background: var(--navy); color: #FFFFFF; }
.bar .in { max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none; }
.brand b { font-family: var(--display); font-size: 18px; }

/* ---------------- Instructions ---------------- */
.wrap { max-width: 960px; margin: 0 auto; padding: 26px 20px 60px; display: grid; gap: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.card h2 { font-size: 18px; margin-bottom: 12px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.facts div { background: var(--soft); border-radius: 12px; padding: 12px; }
.facts b { display: block; font-family: var(--display); font-size: 20px; }
.facts span { font-size: 13px; color: var(--muted); }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.legend div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 20px; }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.n-warn { background: var(--orange-soft); color: var(--orange-ink); }
.n-info { background: var(--blue-soft); color: var(--blue-ink); }
.n-ok { background: var(--green-soft); color: var(--green-ink); }
.n-err { background: var(--red-soft); color: var(--red); }
.seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font: 600 13px/1 var(--body); border: 0; background: transparent; color: var(--muted); padding: 9px 12px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; }

/* Palette chips (shared) */
.chip { width: 40px; height: 36px; border-radius: 6px; display: inline-grid; place-items: center; font: 600 13px/1 var(--body); background: var(--grey-soft); color: var(--muted); border: 1px solid transparent; position: relative; cursor: pointer; }
.chip.nv { background: var(--grey-soft); color: var(--muted); }
.chip.na { background: var(--card); color: var(--orange-ink); border: 2px solid var(--orange); }
.chip.an { background: #1E7A46; color: #FFFFFF; }
.chip.mr { background: #5B2D91; color: #FFFFFF; border-radius: 50%; }
.chip.am { background: #5B2D91; color: #FFFFFF; border-radius: 50%; }
.chip.am::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: #2FBF71; border: 2px solid var(--card); }
.chip.cur { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------------- Exam ---------------- */
.exam { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
.exam-top .in { justify-content: space-between; }
.cand { display: flex; flex-direction: column; gap: 1px; }
.cand b { font-family: var(--display); font-size: 16px; }
.cand span { font-size: 12px; color: #C9D0EC; }
.top-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.timer { display: flex; align-items: center; gap: 8px; background: var(--navy-2); padding: 7px 12px; border-radius: 10px; }
.timer span { font-size: 12px; color: #C9D0EC; }
.timer b { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--gold); font-family: var(--display); }
.timer.warn b { color: #FFB86B; }
.timer.danger { background: #7A1A12; }
.timer.danger b { color: #FFFFFF; }
.tool { background: transparent; border: 1px solid var(--navy-line); color: #FFFFFF; border-radius: 8px; min-height: 36px; padding: 0 10px; font: 600 13px/1 var(--body); cursor: pointer; }
.save-state { font-size: 12px; color: #C9D0EC; display: inline-flex; gap: 6px; align-items: center; }
.save-state i { width: 8px; height: 8px; border-radius: 50%; background: #2FBF71; display: inline-block; }
.save-state.off i { background: #FFB86B; }
.tabs { background: var(--card); border-bottom: 1px solid var(--line); }
.tabs .in { max-width: 1280px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; }
.tabs button { font: 600 14px/1 var(--body); min-height: 46px; padding: 0 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); }
.tabs button small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.exam-body { max-width: 1280px; width: 100%; margin: 0 auto; padding: 14px 20px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; min-height: 0; }
.qpane { background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.qhead { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qhead b { font-family: var(--display); font-size: 17px; }
.qhead span { font-size: 13px; color: var(--muted); }
.qbody { padding: 18px; overflow-y: auto; display: grid; gap: 16px; align-content: start; font-size: var(--qsize); user-select: none; -webkit-user-select: none; }
.qtext { line-height: 1.65; white-space: pre-line; }
.ar { display: grid; gap: 8px; }
.ar div { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.mtable { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 560px; }
.mtable table td, .mtable table th { font-size: calc(var(--qsize) - 2px); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; font-size: var(--qsize); color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 52px; cursor: pointer; }
.opt:hover { border-color: var(--blue); }
.opt .k { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: var(--grey-soft); }
.opt.multi .k { border-radius: 6px; }
.opt[aria-checked="true"] { border-color: #1E7A46; background: var(--green-soft); }
.opt[aria-checked="true"] .k { background: #1E7A46; color: #FFFFFF; }
.numwrap { display: grid; gap: 10px; max-width: 320px; }
.numwrap input { font: 600 22px/1 var(--display); padding: 12px 14px; border: 2px solid var(--field); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.keypad button { font: 600 18px/1 var(--display); min-height: 46px; border-radius: 8px; border: 1px solid var(--field); background: var(--card); color: var(--ink); cursor: pointer; }
.keypad button.wide { grid-column: span 3; font-size: 14px; }
.qfoot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.qfoot .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.side { background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.side-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
.side-head div { display: flex; align-items: center; gap: 8px; }
.side-head .chip { width: 28px; height: 26px; font-size: 12px; cursor: default; }
.grid-wrap { padding: 12px 14px; overflow-y: auto; }
.grid-wrap h3 { font-size: 13px; font-family: var(--body); color: var(--muted); margin: 4px 0 8px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, 40px); gap: 8px; margin-bottom: 12px; }
.side-foot { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.palette-toggle { display: none; }

/* Dialogs */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--card); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,0.35); }
dialog::backdrop { background: rgba(10,14,28,0.6); }
.dh { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dh h2 { font-size: 18px; }
.db { padding: 18px 20px; display: grid; gap: 14px; max-height: 70vh; overflow-y: auto; }
.df { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.close { background: none; border: 0; color: var(--muted); font-size: 24px; cursor: pointer; min-width: 36px; min-height: 36px; }
label.l { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.input { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--field); border-radius: 8px; background: var(--card); color: var(--ink); width: 100%; }
textarea.input { min-height: 80px; resize: vertical; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { font: 500 13px/1 var(--body); padding: 10px 12px; border-radius: 999px; border: 1px solid var(--field); background: var(--card); color: var(--ink); cursor: pointer; }
.choices button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }

/* ---------------- Result ---------------- */
.res-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; display: grid; gap: 18px; }
.res-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
.res-head h1 { font-size: 26px; }
.res-head p { color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.kpi.main { background: var(--navy); color: #FFFFFF; border: 0; }
.kpi b { display: block; font-family: var(--display); font-size: 26px; }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi.main span { color: #C9D0EC; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.barrow { display: grid; grid-template-columns: 120px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: 14px; margin-bottom: 10px; }
.barrow > div { height: 10px; background: var(--grey-soft); border-radius: 999px; overflow: hidden; }
.barrow i { display: block; height: 10px; border-radius: 999px; }
.barrow b { text-align: right; }
.tipl { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
.review { display: grid; gap: 12px; }
.rq { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.rq-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
.p-correct { background: var(--green-soft); color: var(--green-ink); }
.p-wrong { background: var(--red-soft); color: var(--red); }
.p-partial { background: var(--gold-soft); color: var(--gold-ink); }
.p-skipped { background: var(--grey-soft); color: var(--muted); }
.ans { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
.ans span { padding: 6px 10px; border-radius: 8px; }
.ans .yours { border: 2px solid var(--field); }
.ans .yours.bad { border-color: var(--orange); color: var(--orange-ink); }
.ans .right { background: var(--green-soft); border: 2px solid #1E7A46; color: var(--green-ink); }
.sol { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.6; white-space: pre-line; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #FFFFFF; padding: 12px 18px; border-radius: 10px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 80; max-width: calc(100vw - 32px); }
.demo-note { font-size: 12px; color: var(--muted); text-align: center; }

@media (max-width: 960px) {
  .exam-body { grid-template-columns: 1fr; padding: 10px; }
  .side { position: fixed; inset: auto 0 0 0; height: 70vh; border-radius: 16px 16px 0 0; z-index: 40; box-shadow: 0 -20px 50px rgba(0,0,0,0.3); transform: translateY(100%); transition: transform 0.2s; }
  .side.open { transform: translateY(0); }
  .palette-toggle { display: inline-flex; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two { grid-template-columns: 1fr; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .qfoot .btn { flex: 1 1 auto; }
  .cand span { display: none; }
  .save-state { display: none; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
.tv-logo { display: block; width: auto; aspect-ratio: 1784 / 409; flex: 0 0 auto; }
</style>
</head>

    math($('#review'));
    $$('[data-report]').forEach(function (b) { b.addEventListener('click', function () { reportQ = Number(b.dataset.report); openReport(); }); });
    $$('[data-video]').forEach(function (b) { b.addEventListener('click', function () { openVideo(R.items[Number(b.dataset.video) - 1]); }); });
  }
  function openReport() {
    var reasons = ['Wrong answer key', 'Mistake in the question', 'Wrong or unclear solution', 'Diagram missing or unclear', 'Out of syllabus'];
    $('#dr-t').textContent = 'Report a problem with Q.' + reportQ;
    $('#dr-reasons').innerHTML = reasons.map(function (r) { return '<button type="button" aria-pressed="' + (r === reportReason) + '">' + r + '</button>'; }).join('');
    $$('#dr-reasons button').forEach(function (b) { b.addEventListener('click', function () { reportReason = b.textContent; $$('#dr-reasons button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }); });
    $('#dr-note').value = '';
    $('#d-report').showModal();
  }
  $('#dr-send').addEventListener('click', function () {
    /* REAL APP: POST /reports {testId, questionId, reason, note} -> admin "Reported questions" */
    $('#d-report').close(); toast('Thanks. We\u2019ll check Q.' + reportQ + ' and let you know.');
  });
  var videoItem = null;
  function openVideo(it) {
    videoItem = it;
    $('#dv-q').innerHTML = '<b>Q.' + it.n + '</b> · ' + esc(it.f.sec) + ' · ' + esc(it.f.q.chapter) + '<br>' + esc(tx(it.f.q.text));
    math($('#dv-q'));
    $('#dv-note').value = '';
    $('#dv-limit').textContent = 'You can send ' + STUDENT.videoLeft + ' more request' + (STUDENT.videoLeft === 1 ? '' : 's') + ' this week. We reply within ' + STUDENT.videoHours + ' hours, in the app and on WhatsApp.';
    $('#d-video').showModal();
  }
  $('#dv-send').addEventListener('click', function () {
    /* REAL APP: POST /video-requests {source:'test', testId, questionId, note} -> admin "Video requests" */
    if (STUDENT.videoLeft <= 0) { toast('You\u2019ve used all your requests this week.'); return; }
    STUDENT.videoLeft--; $('#d-video').close(); toast('Request sent for Q.' + videoItem.n + '. We\u2019ll notify you when the video is ready.');
  });
  $$('[data-close]').forEach(function (b) { b.addEventListener('click', function () { b.closest('dialog').close(); }); });

  function demoAttempt() {
    // A sample finished attempt so the result page can be seen directly.
    var picks = {};
    flat.forEach(function (f, i) {
      var q = f.q, a;
      if (i % 5 === 3) a = null;
      else if (i % 4 === 1) a = q.type === 'multiple' ? [0] : (q.type === 'integer' || q.type === 'numerical') ? String(q.answer + 1) : (q.answer + 1) % 4;
      else a = q.type === 'integer' || q.type === 'numerical' ? String(q.answer) : q.answer;
      picks[q.id] = { answer: a, marked: i === 6, visited: true, timeMs: (20 + (i * 37) % 200) * 1000 };
    });
    var started = Date.now() - 18 * 60000;
    attempt = { paperId: paper.id, startedAt: started, durationMs: paper.durationMin * 60000, responses: picks, current: 0, lang: 'en', tabSwitches: 0, submittedAt: started + 17 * 60000, demo: true };
  }

  /* ==================== start ==================== */
  function boot() {
    if (qs.get('view') === 'result') { renderResult(); show('v-result'); return; }
    if (attempt && attempt.submittedAt) { if (qs.get('retake') === '1') { attempt = null; try { localStorage.removeItem(KEY); } catch (e) {} } else { renderResult(); show('v-result'); return; } }
    if (attempt && !attempt.submittedAt && timeLeft() <= 0) { submit(true); return; }
    renderInstr(); show('v-instr');
  }
  if (document.readyState === 'complete') boot(); else window.addEventListener('load', boot);
})();
</script>
</body>
</html>
